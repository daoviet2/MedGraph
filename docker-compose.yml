# =============================================================================
# MedGraph: Hạ tầng cơ sở dữ liệu (Docker Compose)
#
# Dịch vụ:
#   - neo4j: Đồ thị tri thức (Knowledge Graph) Neo4j 5 Community Edition
#   - qdrant: Vector store (Profile 'rag', chỉ khởi động khi kích hoạt RAG ở P2+)
#
# Khởi động Neo4j cho P1:
#   docker compose up -d neo4j
# =============================================================================

services:
  neo4j:
    image: neo4j:5.26-community
    container_name: medgraph-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"  # HTTP / Neo4j Browser
      - "7687:7687"  # Bolt protocol
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-medgraph_secret}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*"
      NEO4J_server_memory_pagecache_size: "512M"
      NEO4J_server_memory_heap_initial__size: "512M"
      NEO4J_server_memory_heap_max__size: "1G"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test:
        - "CMD"
        - "cypher-shell"
        - "-u"
        - "${NEO4J_USER:-neo4j}"
        - "-p"
        - "${NEO4J_PASSWORD:-medgraph_secret}"
        - "RETURN 1"
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: medgraph-qdrant
    restart: unless-stopped
    profiles:
      - rag
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  neo4j_data:
    name: medgraph_neo4j_data
  neo4j_logs:
    name: medgraph_neo4j_logs
  qdrant_data:
    name: medgraph_qdrant_data
